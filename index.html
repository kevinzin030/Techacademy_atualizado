<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechAcademy - Autenticação</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#070f1e',
                            navy: '#102a45',
                            blue: '#2563eb',
                            light: '#e0f2fe'
                        }
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- CSS Customizado -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-brand-dark min-h-screen flex items-center justify-center p-4 relative overflow-y-auto font-sans">

    <!-- Container do Toast Notification -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 max-w-md"></div>

    <!-- Background Decorativo -->
    <div class="absolute -top-24 -left-24 w-96 h-96 bg-brand-blue/20 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-24 -right-24 w-96 h-96 bg-blue-400/10 rounded-full blur-3xl"></div>

    <div class="w-full max-w-md space-y-4 my-8 relative z-10">
        <!-- Card de Login -->
        <div class="bg-white rounded-2xl shadow-2xl p-8 border border-slate-100">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-brand-dark text-brand-blue rounded-2xl mb-4 shadow-lg border border-slate-700">
                    <i class="fa-solid fa-graduation-cap text-3xl text-blue-400"></i>
                </div>
                <h1 class="text-2xl font-bold text-brand-dark">TechAcademy</h1>
                <p class="text-sm text-slate-500 mt-1">Plataforma Acadêmica Inteligente</p>
            </div>

            <!-- Alternador de Perfil -->
            <div class="bg-slate-100 p-1 rounded-xl flex mb-6">
                <button type="button" id="role-btn-professor" class="flex-1 py-2 text-xs font-semibold rounded-lg transition-all shadow-sm bg-white text-brand-dark">
                    <i class="fa-solid fa-chalkboard-user mr-1"></i> Professor (RP)
                </button>
                <button type="button" id="role-btn-aluno" class="flex-1 py-2 text-xs font-semibold rounded-lg text-slate-500 hover:text-brand-dark transition-all">
                    <i class="fa-solid fa-user-graduate mr-1"></i> Aluno (RA)
                </button>
            </div>

            <form id="login-form" class="space-y-4">
                <div>
                    <label id="login-label" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">RP (Registro de Professor)</label>
                    <div class="relative">
                        <i id="login-icon" class="fa-solid fa-id-card absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
                        <input type="text" id="login-identifier" required class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-brand-blue focus:ring-2 focus:ring-brand-blue/20 text-sm transition" placeholder="PROF-2024-882">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">Senha</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
                        <input type="password" id="login-password" value="123" required class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-brand-blue focus:ring-2 focus:ring-brand-blue/20 text-sm transition" placeholder="••••••••">
                    </div>
                </div>

                <div class="flex items-center justify-between text-xs text-slate-500">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" checked class="rounded border-slate-300 text-brand-blue focus:ring-brand-blue">
                        <span>Lembrar-me</span>
                    </label>
                    <a href="#" id="forgot-password" class="text-brand-blue hover:underline">Esqueceu a senha?</a>
                </div>

                <button type="submit" class="w-full py-3.5 bg-brand-blue hover:bg-brand-navy text-white font-bold rounded-xl transition shadow-lg hover:shadow-xl flex items-center justify-center gap-2 text-base cursor-pointer">
                    <span>Entrar na Plataforma</span>
                    <i class="fa-solid fa-arrow-right text-sm"></i>
                </button>
            </form>

            <div class="mt-6 pt-4 border-t border-slate-100 text-center text-xs text-slate-400">
                <i class="fa-solid fa-flask mr-1 text-brand-blue"></i> Ambiente de Teste de Usabilidade
            </div>
        </div>

        <!-- Tabela de Contas para Teste de Usabilidade -->
        <div class="bg-slate-900/90 backdrop-blur border border-slate-800 rounded-2xl p-5 text-white shadow-xl space-y-3">
            <h3 class="text-xs font-bold uppercase tracking-wider text-blue-400 flex items-center gap-2">
                <i class="fa-solid fa-users"></i> Contas Cadastradas para Testes (Senha Padrão: <span class="text-white font-mono bg-slate-800 px-1.5 py-0.5 rounded">123</span>)
            </h3>

            <!-- Professores -->
            <div class="space-y-1">
                <div class="text-[11px] font-semibold text-slate-400 flex items-center gap-1">
                    <i class="fa-solid fa-chalkboard-user text-amber-400"></i> Professores Cadastrados:
                </div>
                <div class="grid grid-cols-1 gap-1 text-xs">
                    <button type="button" onclick="preencherLogin('professor', 'PROF-2024-882')" class="text-left bg-slate-800/80 hover:bg-slate-800 px-2.5 py-1.5 rounded-lg border border-slate-700/60 flex items-center justify-between transition group">
                        <span><strong class="text-slate-200">Dr. Carlos Eduardo Silva</strong> <span class="text-slate-400 text-[11px]">(Web & UX)</span></span>
                        <code class="text-blue-400 group-hover:underline">PROF-2024-882</code>
                    </button>
                    <button type="button" onclick="preencherLogin('professor', 'PROF-2024-901')" class="text-left bg-slate-800/80 hover:bg-slate-800 px-2.5 py-1.5 rounded-lg border border-slate-700/60 flex items-center justify-between transition group">
                        <span><strong class="text-slate-200">Dra. Ana Beatris Souza</strong> <span class="text-slate-400 text-[11px]">(Banco de Dados)</span></span>
                        <code class="text-blue-400 group-hover:underline">PROF-2024-901</code>
                    </button>
                    <button type="button" onclick="preencherLogin('professor', 'PROF-2024-905')" class="text-left bg-slate-800/80 hover:bg-slate-800 px-2.5 py-1.5 rounded-lg border border-slate-700/60 flex items-center justify-between transition group">
                        <span><strong class="text-slate-200">Prof. Roberto Mendes</strong> <span class="text-slate-400 text-[11px]">(Arquitetura)</span></span>
                        <code class="text-blue-400 group-hover:underline">PROF-2024-905</code>
                    </button>
                </div>
            </div>

            <!-- Alunos -->
            <div class="space-y-1 pt-1">
                <div class="text-[11px] font-semibold text-slate-400 flex items-center gap-1">
                    <i class="fa-solid fa-user-graduate text-emerald-400"></i> Alunos Cadastrados:
                </div>
                <div class="grid grid-cols-1 gap-1 text-xs">
                    <button type="button" onclick="preencherLogin('aluno', '2023001')" class="text-left bg-slate-800/80 hover:bg-slate-800 px-2.5 py-1.5 rounded-lg border border-slate-700/60 flex items-center justify-between transition group">
                        <span><strong class="text-slate-200">Lucas Mendes Santos</strong></span>
                        <code class="text-emerald-400 group-hover:underline">2023001</code>
                    </button>
                    <button type="button" onclick="preencherLogin('aluno', '2023002')" class="text-left bg-slate-800/80 hover:bg-slate-800 px-2.5 py-1.5 rounded-lg border border-slate-700/60 flex items-center justify-between transition group">
                        <span><strong class="text-slate-200">Mariana Oliveira Rocha</strong></span>
                        <code class="text-emerald-400 group-hover:underline">2023002</code>
                    </button>
                    <button type="button" onclick="preencherLogin('aluno', '2023003')" class="text-left bg-slate-800/80 hover:bg-slate-800 px-2.5 py-1.5 rounded-lg border border-slate-700/60 flex items-center justify-between transition group">
                        <span><strong class="text-slate-200">Gabriel Costa Lima</strong></span>
                        <code class="text-emerald-400 group-hover:underline">2023003</code>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
